<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Demo frame 1: sample sedan front-left walk-around drawing">
  <rect x="0" y="0" width="1000" height="1000" fill="#f4f1ea"/>
  <text x="40" y="72" font-family="monospace" font-size="30" fill="#6b675f">yard-case-4a · demo-frame-1 · front-left</text>
  <line x1="60" y1="800" x2="940" y2="800" stroke="#b9b3a6" stroke-width="4"/>
  <!-- body -->
  <rect x="180" y="430" width="640" height="250" rx="36" fill="#e3ded3" stroke="#2a2723" stroke-width="6"/>
  <!-- greenhouse -->
  <polygon points="330,430 670,430 610,310 390,310" fill="#cfd8dc" stroke="#2a2723" stroke-width="6"/>
  <rect x="390" y="272" width="220" height="40" rx="10" fill="#e3ded3" stroke="#2a2723" stroke-width="6"/>
  <!-- grille + plate -->
  <rect x="410" y="500" width="180" height="60" rx="8" fill="#2a2723"/>
  <line x1="500" y1="500" x2="500" y2="560" stroke="#f4f1ea" stroke-width="4"/>
  <rect x="460" y="640" width="80" height="30" rx="4" fill="#f4f1ea" stroke="#2a2723" stroke-width="4"/>
  <!-- headlights -->
  <rect x="220" y="480" width="120" height="60" rx="10" fill="#fdf6d8" stroke="#2a2723" stroke-width="6"/>
  <rect x="660" y="480" width="120" height="60" rx="10" fill="#fdf6d8" stroke="#2a2723" stroke-width="6"/>
  <!-- bumper -->
  <rect x="180" y="620" width="640" height="80" rx="18" fill="#d5cfc1" stroke="#2a2723" stroke-width="6"/>
  <line x1="260" y1="636" x2="260" y2="684" stroke="#2a2723" stroke-width="4"/>
  <line x1="740" y1="636" x2="740" y2="684" stroke="#2a2723" stroke-width="4"/>
  <!-- wheels -->
  <ellipse cx="260" cy="730" rx="70" ry="70" fill="#3a3733" stroke="#2a2723" stroke-width="6"/>
  <circle cx="260" cy="730" r="24" fill="#b9b3a6" stroke="#2a2723" stroke-width="4"/>
  <ellipse cx="740" cy="730" rx="70" ry="70" fill="#3a3733" stroke="#2a2723" stroke-width="6"/>
  <circle cx="740" cy="730" r="24" fill="#b9b3a6" stroke="#2a2723" stroke-width="4"/>
  <!-- driver mirror -->
  <line x1="180" y1="455" x2="128" y2="455" stroke="#2a2723" stroke-width="6"/>
  <rect x="128" y="440" width="52" height="40" rx="8" fill="#cfd8dc" stroke="#2a2723" stroke-width="6"/>
  <text x="40" y="950" font-family="monospace" font-size="26" fill="#6b675f">sample drawing — boxes overlay from harvest map</text>
</svg>
