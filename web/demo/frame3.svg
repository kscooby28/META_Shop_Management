<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Demo frame 3: sample sedan rear-left walk-around drawing">
  <rect x="0" y="0" width="1000" height="1000" fill="#f4f1ea"/>
  <text x="40" y="72" font-family="monospace" font-size="30" fill="#6b675f">yard-case-4a · demo-frame-3 · rear-left</text>
  <line x1="60" y1="800" x2="940" y2="800" stroke="#b9b3a6" stroke-width="4"/>
  <!-- body -->
  <rect x="200" y="440" width="600" height="240" rx="30" fill="#e3ded3" stroke="#2a2723" stroke-width="6"/>
  <!-- rear glass -->
  <polygon points="340,440 660,440 610,330 390,330" fill="#cfd8dc" stroke="#2a2723" stroke-width="6"/>
  <!-- trunk + badge -->
  <line x1="240" y1="580" x2="760" y2="580" stroke="#b9b3a6" stroke-width="4"/>
  <circle cx="500" cy="470" r="16" fill="#b9b3a6" stroke="#2a2723" stroke-width="5"/>
  <!-- taillights: left cracked -->
  <rect x="230" y="490" width="100" height="70" rx="10" fill="#e8a3a3" stroke="#2a2723" stroke-width="6"/>
  <polyline points="250,495 275,520 265,545 295,555" fill="none" stroke="#2a2723" stroke-width="4"/>
  <polyline points="310,495 290,525 305,550" fill="none" stroke="#2a2723" stroke-width="4"/>
  <rect x="670" y="490" width="100" height="70" rx="10" fill="#c96a6a" stroke="#2a2723" stroke-width="6"/>
  <!-- rear bumper -->
  <rect x="200" y="600" width="600" height="80" rx="16" fill="#d5cfc1" stroke="#2a2723" stroke-width="6"/>
  <!-- wheels -->
  <ellipse cx="280" cy="710" rx="66" ry="66" fill="#3a3733" stroke="#2a2723" stroke-width="6"/>
  <circle cx="280" cy="710" r="22" fill="#b9b3a6" stroke="#2a2723" stroke-width="4"/>
  <ellipse cx="720" cy="710" rx="66" ry="66" fill="#3a3733" stroke="#2a2723" stroke-width="6"/>
  <circle cx="720" cy="710" r="22" fill="#b9b3a6" stroke="#2a2723" stroke-width="4"/>
  <!-- differential peeking under the car on stands -->
  <rect x="360" y="760" width="40" height="40" fill="#8a8478" stroke="#2a2723" stroke-width="4"/>
  <rect x="600" y="760" width="40" height="40" fill="#8a8478" stroke="#2a2723" stroke-width="4"/>
  <line x1="380" y1="740" x2="620" y2="740" stroke="#2a2723" stroke-width="10"/>
  <circle cx="500" cy="740" r="34" fill="#6e6a61" stroke="#2a2723" stroke-width="6"/>
  <circle cx="500" cy="740" r="10" fill="#2a2723"/>
  <text x="40" y="950" font-family="monospace" font-size="26" fill="#6b675f">sample drawing — boxes overlay from harvest map</text>
</svg>
